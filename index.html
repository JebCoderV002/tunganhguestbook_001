<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kỷ Niệm Thanh Xuân - Gửi Lưu Bút</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Sách vở, nhẹ nhàng, hoài niệm -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
        }
        .font-serif-vintage {
            font-family: 'Playfair Display', serif;
        }
        .font-accent {
            font-family: 'Comfortaa', cursive;
        }
        /* Hiệu ứng chuyển động mượt mà cho hoa rơi */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body class="relative min-h-screen flex items-center justify-center overflow-x-hidden p-4 md:p-8 bg-cover bg-center bg-no-repeat transition-all duration-1000" id="bg-body">
    
    <!-- Canvas tạo hiệu ứng cánh hoa rơi -->
    <canvas id="blossom-canvas"></canvas>

    <!-- Lớp phủ mờ (Glassmorphism Overlay & Background blur) -->
    <div class="absolute inset-0 z-0 bg-slate-900/40 backdrop-blur-[3px]" id="overlay-blur"></div>

    <!-- Container nội dung chính -->
    <div class="relative z-20 w-full max-w-lg bg-white/20 dark:bg-black/30 backdrop-blur-md rounded-2xl border border-white/30 shadow-2xl p-6 md:p-8 text-white transition-all duration-500 hover:shadow-pink-500/10">
        
        <!-- Khu vực tiêu đề / Thư gửi học trò -->
        <div class="text-center mb-8">
            <span class="inline-block px-3 py-1 bg-white/20 backdrop-blur-sm rounded-full text-xs font-semibold uppercase tracking-widest text-pink-100 mb-3 border border-white/10" id="sub-title">Hạ Cuối &bull; Niên Khóa 2023 - 2026</span>
            <h1 class="text-3xl md:text-4xl font-serif-vintage italic font-semibold text-pink-100 mb-2 drop-shadow" id="main-title">
                Gửi Lại Thanh Xuân
            </h1>
            <p class="text-sm text-slate-100/90 leading-relaxed max-w-sm mx-auto" id="welcome-message">
                "Ngoảnh đi ngoảnh lại, thanh xuân đã trôi qua như một cơn mưa rào. Hãy viết lại vài dòng gửi gắm kỷ niệm của bạn ở đây nhé..."
            </p>
        </div>

        <!-- Biểu mẫu gửi lưu bút -->
        <form id="memory-form" class="space-y-5">
            <!-- Ô Nhập Tên -->
            <div>
                <label for="student-name" class="block text-sm font-medium text-pink-100 mb-1 ml-1 drop-shadow-sm">Tên của bạn là...</label>
                <input 
                    type="text" 
                    id="student-name" 
                    name="name" 
                    required 
                    placeholder="Cho tớ biết cậu là ai nhé..." 
                    class="w-full px-4 py-3 bg-white/15 focus:bg-white/25 border border-white/25 rounded-xl placeholder-white/50 text-white focus:outline-none focus:ring-2 focus:ring-pink-300 transition-all duration-300 shadow-inner"
                />
            </div>

            <!-- Ô Viết Lưu Bút -->
            <div>
                <label for="memory-text" class="block text-sm font-medium text-pink-100 mb-1 ml-1 drop-shadow-sm">Viết cho những năm tháng ấy...</label>
                <textarea 
                    id="memory-text" 
                    name="message" 
                    rows="5" 
                    required 
                    placeholder="Cậu muốn nhắn gửi điều gì tới tớ nè..." 
                    class="w-full px-4 py-3 bg-white/15 focus:bg-white/25 border border-white/25 rounded-xl placeholder-white/50 text-white focus:outline-none focus:ring-2 focus:ring-pink-300 transition-all duration-300 shadow-inner resize-none"
                ></textarea>
            </div>

            <!-- Nút gửi lưu bút -->
            <button 
                type="submit" 
                id="submit-btn" 
                class="w-full py-3.5 bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-bold rounded-xl shadow-lg hover:shadow-xl hover:shadow-pink-500/20 active:scale-[0.98] transition-all duration-200 flex items-center justify-center space-x-2"
            >
                <span id="btn-text">Nhắn Gửi Thanh Xuân</span>
                <span id="btn-loader" class="hidden">
                    <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </span>
            </button>
        </form>

        <!-- Trạng thái phản hồi người dùng (Popup ẩn/hiện) -->
        <div id="status-toast" class="hidden mt-4 p-4 rounded-xl text-center text-sm font-semibold transition-all duration-300"></div>

    </div>

    <!-- CẤU HÌNH ADMIN (Có thể tùy biến dễ dàng tại đây) -->
    <script>
        const ADMIN_CONFIG = {
            // URL Google Apps Script Web App (Đường link nhận dữ liệu để gửi lên Google Sheet)
            // Nhập đường dẫn Deployment Web App của bạn vào đây sau khi thiết lập Google Apps Script
            googleSheetScriptUrl: "https://script.google.com/macros/s/AKfycbzoDPvWjvVDMOaYSw7m6rjt9zHrDG0H7QtFW_V-tp4cjUykwMAeVmGITOXaD0UPvrLp/exec", 

            // Link ảnh nền mặc định (Có thể đổi link ảnh kỷ yếu tùy ý)
            backgroundImage: "https://i.ibb.co/d0ybHwTh/Gemini-Generated-Image-2.png", 

            // Mức độ làm mờ nền (backdrop blur): từ 'blur-none', 'blur-sm', 'blur-md', 'blur-lg' đến 'blur-xl'
            blurClass: "backdrop-blur-sm",

            // Kiểu cánh hoa rơi: 'cherry' (hoa đào hồng nhẹ), 'phoenix' (hoa phượng vĩ đỏ mùa hè), hoặc 'leaf' (lá vàng thu)
            petalType: "cherry", 

            // Số lượng cánh hoa rơi cùng lúc trên màn hình (Độ dày mỏng của cánh hoa)
            maxPetals: 35,

            // Thay đổi các văn bản hiển thị trên trang web
            texts: {
                subTitle: "Hạ Cuối • Niên Khóa 2023 - 2026",
                mainTitle: "Gửi Lại Thanh Xuân",
                welcomeMessage: `"Cảm ơn cậu vì đã là một phần trong thanh xuân của tớ!"`
            }
        };
    </script>

    <!-- Khởi tạo cấu hình và logic hoạt động cho trang web -->
    <script>
        // Thiết lập cấu hình từ Admin
        document.addEventListener("DOMContentLoaded", () => {
            const bgBody = document.getElementById('bg-body');
            const overlayBlur = document.getElementById('overlay-blur');
            const subTitle = document.getElementById('sub-title');
            const mainTitle = document.getElementById('main-title');
            const welcomeMessage = document.getElementById('welcome-message');
            const footerText = document.getElementById('footer-text');

            // Set hình nền và độ mờ
            if (ADMIN_CONFIG.backgroundImage) {
                bgBody.style.backgroundImage = `url('${ADMIN_CONFIG.backgroundImage}')`;
            }
            if (ADMIN_CONFIG.blurClass) {
                overlayBlur.className = `absolute inset-0 z-0 bg-slate-900/40 ${ADMIN_CONFIG.blurClass}`;
            }

            // Set nội dung text
            subTitle.innerHTML = ADMIN_CONFIG.texts.subTitle;
            mainTitle.innerHTML = ADMIN_CONFIG.texts.mainTitle;
            welcomeMessage.innerHTML = ADMIN_CONFIG.texts.welcomeMessage;
            footerText.innerHTML = ADMIN_CONFIG.texts.footerText;

            // Khởi chạy canvas hiệu ứng cánh hoa rơi
            initPetalRain(ADMIN_CONFIG.petalType, ADMIN_CONFIG.maxPetals);
        });

        /* ================= HIỆU ỨNG CÁNH HOA RƠI (CANVAS) ================= */
        function initPetalRain(type, maxPetals) {
            const canvas = document.getElementById("blossom-canvas");
            const ctx = canvas.getContext("2d");

            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            // Lắng nghe sự kiện resize màn hình để thích ứng tốt trên mobile và desktop
            window.addEventListener("resize", () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const petals = [];

            // Thiết lập bảng màu sắc cho từng loại cánh hoa/lá
            let colorPalette = [];
            if (type === "cherry") {
                // Hoa đào cánh hồng đào lãng mạn
                colorPalette = [
                    { fill: "rgba(255, 183, 197, 0.8)", stroke: "rgba(255, 153, 172, 0.5)" },
                    { fill: "rgba(255, 214, 224, 0.7)", stroke: "rgba(255, 183, 197, 0.4)" },
                    { fill: "rgba(244, 143, 177, 0.6)", stroke: "rgba(240, 98, 146, 0.3)" }
                ];
            } else if (type === "phoenix") {
                // Hoa phượng mùa hè đỏ thắm, cam ấm áp
                colorPalette = [
                    { fill: "rgba(244, 67, 54, 0.8)", stroke: "rgba(229, 57, 53, 0.5)" },    // Đỏ tươi
                    { fill: "rgba(255, 87, 34, 0.75)", stroke: "rgba(244, 81, 30, 0.4)" },  // Cam đỏ
                    { fill: "rgba(229, 115, 115, 0.7)", stroke: "rgba(224, 64, 251, 0.2)" } // Hồng đậm
                ];
            } else {
                // Lá vàng mùa thu rơi phong cách vintage
                colorPalette = [
                    { fill: "rgba(251, 192, 45, 0.8)", stroke: "rgba(245, 127, 23, 0.5)" }, // Vàng lá phong
                    { fill: "rgba(230, 124, 115, 0.7)", stroke: "rgba(168, 47, 47, 0.4)" }, // Nâu đỏ phong
                    { fill: "rgba(139, 195, 74, 0.6)", stroke: "rgba(104, 159, 56, 0.3)" }  // Úa xanh nhẹ
                ];
            }

            class Petal {
                constructor() {
                    this.reset();
                    // Tạo một điểm xuất phát ngẫu nhiên trên màn hình khi mới khởi động để cánh hoa xuất hiện tự nhiên
                    this.y = Math.random() * height;
                }

                reset() {
                    this.x = Math.random() * width;
                    this.y = -20;
                    this.size = Math.random() * 10 + 6; // Độ lớn của cánh hoa (6px - 16px)
                    this.speedY = Math.random() * 1.5 + 1; // Tốc độ rơi thẳng đứng
                    this.speedX = Math.random() * 1 - 0.5; // Tốc độ bay ngang do gió
                    this.opacity = Math.random() * 0.8 + 0.2;
                    this.angle = Math.random() * Math.PI * 2; // Góc quay của cánh hoa
                    this.spinSpeed = Math.random() * 0.02 - 0.01; // Tốc độ tự xoay quanh trục
                    this.colors = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                }

                update() {
                    this.y += this.speedY;
                    this.x += this.speedX + Math.sin(this.y / 30) * 0.3; // Chuyển động lượn sóng tự nhiên
                    this.angle += this.spinSpeed;

                    // Nếu cánh hoa vượt quá đáy hoặc 2 bên rìa, reset cho bay lại từ trên xuống
                    if (this.y > height + 20 || this.x < -20 || this.x > width + 20) {
                        this.reset();
                    }
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);
                    ctx.beginPath();
                    
                    // Vẽ dáng hình chiếc lá phong hoặc cánh hoa bầu dục mượt mà
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(this.size / 2, -this.size / 2, this.size, 0);
                    ctx.quadraticCurveTo(this.size / 2, this.size / 2, 0, 0);
                    
                    ctx.fillStyle = this.colors.fill;
                    ctx.shadowColor = 'rgba(0,0,0,0.05)';
                    ctx.shadowBlur = 2;
                    ctx.fill();
                    ctx.strokeStyle = this.colors.stroke;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // Thêm cánh hoa vào danh sách render
            for (let i = 0; i < maxPetals; i++) {
                petals.push(new Petal());
            }

            // Vòng lặp vẽ liên tục lên Canvas
            function animate() {
                ctx.clearRect(0, 0, width, height);
                petals.forEach(petal => {
                    petal.update();
                    petal.draw();
                });
                requestAnimationFrame(animate);
            }

            // Bắt đầu chạy hiệu ứng
            animate();
        }

        /* ================= GỬI DỮ LIỆU ĐI GOOGLE SHEET ================= */
        const memoryForm = document.getElementById("memory-form");
        const submitBtn = document.getElementById("submit-btn");
        const btnText = document.getElementById("btn-text");
        const btnLoader = document.getElementById("btn-loader");
        const statusToast = document.getElementById("status-toast");

        memoryForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const name = document.getElementById("student-name").value.trim();
            const message = document.getElementById("memory-text").value.trim();

            if (!name || !message) {
                showToast("Vui lòng điền đầy đủ thông tin nha!", "error");
                return;
            }

            // 1. Kiểm tra xem admin đã thiết lập link Google App Script chưa
            if (!ADMIN_CONFIG.googleSheetScriptUrl) {
                showToast("Gửi lỗi! Admin chưa cấu hình liên kết Google Sheets.", "error");
                return;
            }

            // 2. Kích hoạt hiệu ứng đang tải (Loading status)
            submitBtn.disabled = true;
            btnText.textContent = "Đang gửi nét chữ vào lưu bút...";
            btnLoader.classList.remove("hidden");
            statusToast.classList.add("hidden");

            // Tạo đối tượng dữ liệu gửi đi (kèm timestamp thời gian thực)
            const formData = new URLSearchParams();
            formData.append("name", name);
            formData.append("message", message);
            formData.append("timestamp", new Date().toLocaleString("vi-VN"));

            // 3. Thực hiện cơ chế gọi API với Exponential Backoff (Tự động thử lại tối đa 5 lần)
            let success = false;
            let attempts = 5;
            let delay = 1000;

            for (let i = 0; i < attempts; i++) {
                try {
                    const response = await fetch(ADMIN_CONFIG.googleSheetScriptUrl, {
                        method: "POST",
                        mode: "no-cors", // Tránh lỗi CORS của Google Script khi submit
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded"
                        },
                        body: formData.toString()
                    });

                    // Chế độ no-cors không trả về status 200 thông thường nhưng dữ liệu vẫn được đẩy đi thành công.
                    success = true;
                    break;
                } catch (error) {
                    if (i === attempts - 1) {
                        console.error("Đã thử 5 lần nhưng gửi thất bại:", error);
                        break;
                    }
                    // Chờ đợi nhân đôi thời gian (exponential backoff) trước khi thử lại
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }

            // 4. Kết thúc loading và thông báo kết quả
            submitBtn.disabled = false;
            btnText.textContent = "Gửi Vào Hộp Thư Thanh Xuân";
            btnLoader.classList.add("hidden");

            if (success) {
                showToast("Kỷ niệm của chúng ta đã được tớ cất giữ! Cảm ơn cậu vì đã xuất hiện trong thanh xuân của tớ. ❤️", "success");
                memoryForm.reset();
            } else {
                showToast("Có lỗi xảy ra trong quá trình gửi, bạn thử gửi lại lần nữa nhé!", "error");
            }
        });

        // Hàm hiển thị thông báo xinh xắn dạng Toast
        function showToast(msg, type) {
            statusToast.classList.remove("hidden", "bg-emerald-500/80", "bg-rose-500/80", "border-emerald-400", "border-rose-400");
            
            if (type === "success") {
                statusToast.classList.add("bg-emerald-500/80", "border", "border-emerald-400/40");
            } else {
                statusToast.classList.add("bg-rose-500/80", "border", "border-rose-400/40");
            }
            
            statusToast.textContent = msg;
        }
    </script>
</body>
</html>
